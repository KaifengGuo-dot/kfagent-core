name: Feature request
description: 想加一个能力，或者改一处设计
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先说清楚场景，再聊 API。这个库刻意保持小，不是所有需求都会接。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的具体场景
      description: 现在是怎么绕过去的？为什么现有 API 不够用？
      placeholder: 我有一个订单助手，希望同一轮里并行查库存和物流……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的用法
      description: 贴一段你希望写出来的代码，不需要能编译
      render: java

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 比如自己包一层、换别的库、改业务代码

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 这个功能不需要引入新的第三方依赖
        - label: 我愿意自己提 PR
        - label: 我理解这个项目不做 RAG / 工作流编排 / 模型网关
