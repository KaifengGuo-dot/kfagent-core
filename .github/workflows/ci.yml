name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B -DskipTests package
      - name: Run offline self-test
        run: |
          mkdir -p target/example-classes
          javac -cp target/classes -d target/example-classes $(find src/example -name "*.java")
          java -cp "target/classes:target/example-classes" io.github.kfagent.core.AgentLoopSelfTest
